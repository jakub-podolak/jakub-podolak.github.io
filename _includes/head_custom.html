<script>
  /* Pick the color theme before first paint so there is no flash of the wrong color. */
  window.y2kThemeFor = function (path) {
    if (path.indexOf("/projects") === 0) return "purple";
    if (path.indexOf("/research") === 0) return "pink";
    return "mint";
  };
  document.documentElement.dataset.theme = window.y2kThemeFor(location.pathname);
</script>
